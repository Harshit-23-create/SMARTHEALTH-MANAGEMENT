<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Patient Management Flow — CareFlow HMS</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
  header{background:linear-gradient(135deg,#065f46,#10b981);padding:18px 32px;display:flex;align-items:center;gap:12px}
  header h1{font-size:1.3rem;font-weight:800;color:#fff}
  .tabs{display:flex;gap:2px;padding:0 32px;background:#1e293b;border-bottom:1px solid #334155}
  .tab{padding:12px 20px;font-size:.8rem;font-weight:600;color:#64748b;cursor:pointer;border-bottom:2px solid transparent}
  .tab.active{color:#10b981;border-bottom-color:#10b981}
  .canvas{padding:24px;overflow:auto}
  svg{display:block}
  .panel{display:none}
  .panel.active{display:block}
  .info-panel{position:fixed;right:0;top:0;bottom:0;width:300px;background:#1e293b;border-left:1px solid #334155;padding:20px;transform:translateX(100%);transition:transform .3s;overflow-y:auto;z-index:100}
  .info-panel.open{transform:translateX(0)}
  .ip-title{font-size:.95rem;font-weight:700;color:#f1f5f9;margin-bottom:8px}
  .ip-body{font-size:.8rem;color:#94a3b8;line-height:1.6}
  .ip-body code{background:#0f172a;padding:1px 5px;border-radius:3px;color:#7dd3fc}
  .warn{display:inline-block;padding:3px 8px;border-radius:6px;background:rgba(239,68,68,.15);color:#f87171;font-size:.75rem;font-weight:600;margin:4px 0}
  .ok{display:inline-block;padding:3px 8px;border-radius:6px;background:rgba(16,185,129,.15);color:#4ade80;font-size:.75rem;font-weight:600;margin:4px 0}
  .note{display:inline-block;padding:3px 8px;border-radius:6px;background:rgba(245,158,11,.15);color:#fbbf24;font-size:.75rem;font-weight:600;margin:4px 0}
  .cb{position:absolute;top:12px;right:12px;background:none;border:none;color:#64748b;font-size:1.1rem;cursor:pointer}
  .clickable{cursor:pointer}
  .clickable:hover rect{filter:brightness(1.2)}
</style>
</head>
<body>
<header>
  <svg width="28" height="28" viewBox="0 0 28 28"><circle cx="14" cy="14" r="14" fill="rgba(255,255,255,.2)"/><path d="M6 10h16M6 14h16M6 18h10" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
  <div>
    <h1>Patient Management — Data Flow</h1>
    <div style="font-size:.78rem;color:#d1fae5;margin-top:2px">Verified from PatientManagementPage.jsx · server.js · Patient.js</div>
  </div>
</header>
<div class="tabs">
  <div class="tab active" onclick="switchTab('fetch')">Fetch Patients</div>
  <div class="tab" onclick="switchTab('add')">Add Patient</div>
  <div class="tab" onclick="switchTab('delete')">Discharge/Delete</div>
  <div class="tab" onclick="switchTab('status')">Update Status</div>
  <div class="tab" onclick="switchTab('schema')">Schema Mismatch</div>
</div>

<!-- FETCH PANEL -->
<div id="panel-fetch" class="panel active canvas">
<svg viewBox="0 0 1000 480" width="100%" style="min-width:800px">
  <defs>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#10b981"/></marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/></marker>
    <marker id="ay" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/></marker>
  </defs>

  <text x="500" y="30" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="800">GET /patients — Fetch Flow</text>

  <!-- Mount trigger -->
  <g class="clickable" onclick="showInfo('f1')">
    <rect x="60" y="60" width="160" height="52" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="140" y="82" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">useEffect([], [])</text>
    <text x="140" y="96" text-anchor="middle" fill="#93c5fd" font-size="9">Component mounts</text>
    <text x="140" y="108" text-anchor="middle" fill="#64748b" font-size="8">PatientManagementPage.jsx L64–66</text>
  </g>
  <line x1="220" y1="86" x2="260" y2="86" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ab)"/>

  <!-- fetchPatients -->
  <g class="clickable" onclick="showInfo('f2')">
    <rect x="260" y="60" width="160" height="52" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="340" y="82" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">fetchPatients()</text>
    <text x="340" y="96" text-anchor="middle" fill="#93c5fd" font-size="9">setLoading(true)</text>
    <text x="340" y="108" text-anchor="middle" fill="#64748b" font-size="8">500ms artificial delay</text>
  </g>
  <line x1="420" y1="86" x2="460" y2="86" stroke="#10b981" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- GET /patients -->
  <g class="clickable" onclick="showInfo('f3')">
    <rect x="460" y="60" width="160" height="52" rx="8" fill="#1e3a2f" stroke="#10b981" stroke-width="1.5"/>
    <text x="540" y="82" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">GET /patients</text>
    <text x="540" y="96" text-anchor="middle" fill="#6ee7b7" font-size="9">server.js L194–205</text>
    <text x="540" y="108" text-anchor="middle" fill="#6ee7b7" font-size="9">No authentication required</text>
  </g>
  <line x1="620" y1="86" x2="660" y2="86" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- MongoDB -->
  <g class="clickable" onclick="showInfo('f4')">
    <rect x="660" y="60" width="270" height="52" rx="8" fill="#2e1065" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="795" y="82" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">Patient.find().sort({createdAt:-1})</text>
    <text x="795" y="96" text-anchor="middle" fill="#c4b5fd" font-size="9">MongoDB query — Medicare.patients</text>
    <text x="795" y="108" text-anchor="middle" fill="#a78bfa" font-size="9">Returns array sorted newest-first</text>
  </g>

  <!-- Response paths -->
  <text x="340" y="145" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="700">RESPONSE PATHS</text>

  <!-- Success path -->
  <line x1="795" y1="112" x2="795" y2="155" stroke="#10b981" stroke-width="1.5" marker-end="url(#ag)"/>
  <g class="clickable" onclick="showInfo('f5')">
    <rect x="660" y="155" width="270" height="44" rx="8" fill="#1e3a2f" stroke="#10b981" stroke-width="1.5"/>
    <text x="795" y="173" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">✅ data.length > 0</text>
    <text x="795" y="187" text-anchor="middle" fill="#6ee7b7" font-size="9">setPatients(data) — real MongoDB records</text>
  </g>

  <!-- Empty array fallback -->
  <line x1="540" y1="112" x2="540" y2="155" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ay)"/>
  <g class="clickable" onclick="showInfo('f6')">
    <rect x="430" y="155" width="210" height="44" rx="8" fill="#1c1a08" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="535" y="173" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="700">⚠ data.length === 0</text>
    <text x="535" y="187" text-anchor="middle" fill="#d97706" font-size="9">setPatients(fallbackPatients)</text>
  </g>

  <!-- Network error fallback -->
  <line x1="340" y1="112" x2="340" y2="155" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ar)"/>
  <g class="clickable" onclick="showInfo('f7')">
    <rect x="210" y="155" width="200" height="44" rx="8" fill="#1a0a0a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="310" y="173" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="700">❌ Network error / catch</text>
    <text x="310" y="187" text-anchor="middle" fill="#f87171" font-size="9">setPatients(fallbackPatients)</text>
  </g>

  <!-- Fallback data note -->
  <rect x="60" y="225" width="880" height="60" rx="8" fill="rgba(245,158,11,0.08)" stroke="#92400e" stroke-width="1"/>
  <text x="500" y="248" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="700">fallbackPatients — 6 hardcoded demo records in PatientManagementPage.jsx L15–22</text>
  <text x="500" y="264" text-anchor="middle" fill="#d97706" font-size="9">Eleanor Vance (ICU) · David Miller (ORT) · Amina (SUR) · Carlos (GEN) · Sophia (PED) · Marcus (ICU)</text>
  <text x="500" y="278" text-anchor="middle" fill="#92400e" font-size="9">These have fields (status:Critical/Recovering) that DON'T exist in MongoDB Patient.js schema (only Admitted/Discharged)</text>

  <!-- Final UI render -->
  <rect x="60" y="305" width="880" height="100" rx="8" fill="rgba(59,130,246,0.05)" stroke="#1e3a8a" stroke-width="1"/>
  <text x="500" y="328" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="700">UI Rendering — PatientManagementPage.jsx</text>
  <g class="clickable" onclick="showInfo('f8')">
    <rect x="80" y="338" width="160" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="160" y="356" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="700">Search/Filter</text>
    <text x="160" y="369" text-anchor="middle" fill="#64748b" font-size="8">name/disease search</text>
    <text x="160" y="381" text-anchor="middle" fill="#64748b" font-size="8">status filter tabs</text>
  </g>
  <g class="clickable" onclick="showInfo('f9')">
    <rect x="260" y="338" width="160" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="340" y="356" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="700">Pagination</text>
    <text x="340" y="369" text-anchor="middle" fill="#64748b" font-size="8">6 items per page</text>
    <text x="340" y="381" text-anchor="middle" fill="#64748b" font-size="8">prev/next buttons</text>
  </g>
  <g class="clickable" onclick="showInfo('f10')">
    <rect x="440" y="338" width="160" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="520" y="356" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="700">Stats Cards</text>
    <text x="520" y="369" text-anchor="middle" fill="#64748b" font-size="8">total/critical/admitted/recovering</text>
    <text x="520" y="381" text-anchor="middle" fill="#64748b" font-size="8">computed from patients state</text>
  </g>
  <g class="clickable" onclick="showInfo('f11')">
    <rect x="620" y="338" width="300" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="770" y="356" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="700">Patient Cards Grid</text>
    <text x="770" y="369" text-anchor="middle" fill="#64748b" font-size="8">name · age · gender · disease · doctor · bed · department</text>
    <text x="770" y="381" text-anchor="middle" fill="#64748b" font-size="8">View/Edit/Discharge buttons</text>
  </g>

  <!-- Timestamp -->
  <text x="900" y="460" text-anchor="end" fill="#334155" font-size="8">PatientManagementPage.jsx L41–66</text>
</svg>
</div>

<!-- ADD PATIENT PANEL -->
<div id="panel-add" class="panel canvas">
<svg viewBox="0 0 1000 500" width="100%" style="min-width:800px">
  <defs>
    <marker id="ag2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#10b981"/></marker>
    <marker id="ab2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/></marker>
    <marker id="ay2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/></marker>
  </defs>

  <text x="500" y="30" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="800">POST /patients — Add Patient Flow</text>

  <g class="clickable" onclick="showInfo('a1')">
    <rect x="30" y="60" width="180" height="80" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="120" y="82" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">Add Patient Modal</text>
    <text x="120" y="96" text-anchor="middle" fill="#93c5fd" font-size="9">Fields: name, age, gender</text>
    <text x="120" y="109" text-anchor="middle" fill="#93c5fd" font-size="9">disease, bed, department</text>
    <text x="120" y="122" text-anchor="middle" fill="#93c5fd" font-size="9">contactNumber, status, doctor</text>
    <text x="120" y="135" text-anchor="middle" fill="#64748b" font-size="8">handleAddPatient() on submit</text>
  </g>

  <line x1="210" y1="100" x2="250" y2="100" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ab2)"/>

  <g class="clickable" onclick="showInfo('a2')">
    <rect x="250" y="60" width="180" height="80" rx="8" fill="#1e3a2f" stroke="#10b981" stroke-width="1.5"/>
    <text x="340" y="82" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">POST /patients</text>
    <text x="340" y="96" text-anchor="middle" fill="#6ee7b7" font-size="9">Body: {name,age,disease,bed}</text>
    <text x="340" y="109" text-anchor="middle" fill="#6ee7b7" font-size="9">+ gender,dept,doctor (ignored)</text>
    <text x="340" y="122" text-anchor="middle" fill="#fcd34d" font-size="8">⚠ No Auth header sent!</text>
    <text x="340" y="135" text-anchor="middle" fill="#64748b" font-size="8">server.js L163–191</text>
  </g>

  <line x1="430" y1="100" x2="470" y2="100" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#ag2)"/>

  <g class="clickable" onclick="showInfo('a3')">
    <rect x="470" y="60" width="220" height="80" rx="8" fill="#1e3a2f" stroke="#10b981" stroke-width="1.5"/>
    <text x="580" y="80" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">Backend Validation</text>
    <text x="580" y="94" text-anchor="middle" fill="#6ee7b7" font-size="9">if(!name||!age||!disease||!bed)</text>
    <text x="580" y="107" text-anchor="middle" fill="#6ee7b7" font-size="9">→ 400 "All fields required"</text>
    <text x="580" y="120" text-anchor="middle" fill="#6ee7b7" font-size="9">Sets status = "Admitted" always</text>
    <text x="580" y="133" text-anchor="middle" fill="#64748b" font-size="8">age cast to Number(age)</text>
  </g>

  <line x1="690" y1="100" x2="730" y2="100" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#ag2)"/>

  <g class="clickable" onclick="showInfo('a4')">
    <rect x="730" y="60" width="240" height="80" rx="8" fill="#2e1065" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="850" y="80" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">new Patient({...}).save()</text>
    <text x="850" y="94" text-anchor="middle" fill="#c4b5fd" font-size="9">name, age, disease, bed, status</text>
    <text x="850" y="107" text-anchor="middle" fill="#c4b5fd" font-size="9">createdAt/updatedAt timestamps</text>
    <text x="850" y="120" text-anchor="middle" fill="#a78bfa" font-size="9">gender/doctor/dept NOT saved</text>
    <text x="850" y="133" text-anchor="middle" fill="#64748b" font-size="8">Returns 201 + saved document</text>
  </g>

  <!-- Success response -->
  <line x1="850" y1="140" x2="850" y2="190" stroke="#10b981" stroke-width="1.5" marker-end="url(#ag2)"/>
  <g class="clickable" onclick="showInfo('a5')">
    <rect x="700" y="190" width="290" height="52" rx="8" fill="#1e3a2f" stroke="#10b981" stroke-width="1.5"/>
    <text x="845" y="210" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">✅ 201 Created</text>
    <text x="845" y="224" text-anchor="middle" fill="#6ee7b7" font-size="9">push("patient", "Admitted", name+dept)</text>
    <text x="845" y="237" text-anchor="middle" fill="#6ee7b7" font-size="9">fetchPatients() — reload from DB</text>
  </g>

  <!-- Error path -->
  <line x1="580" y1="140" x2="580" y2="190" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ar2)"/>
  <g class="clickable" onclick="showInfo('a6')">
    <rect x="450" y="190" width="230" height="52" rx="8" fill="#1a0a0a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="565" y="210" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="700">❌ res.ok false / catch</text>
    <text x="565" y="224" text-anchor="middle" fill="#f87171" font-size="9">Local fallback: prepend to patients state</text>
    <text x="565" y="237" text-anchor="middle" fill="#f87171" font-size="9">_id: `patient-${Date.now()}`</text>
  </g>

  <!-- Schema mismatch banner -->
  <rect x="30" y="275" width="940" height="70" rx="8" fill="rgba(239,68,68,0.08)" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="500" y="298" text-anchor="middle" fill="#f87171" font-size="11" font-weight="800">⚠️ CRITICAL SCHEMA MISMATCH</text>
  <text x="500" y="315" text-anchor="middle" fill="#fca5a5" font-size="9">Frontend form sends: name, age, gender, disease, bed, department, contactNumber, status, doctor</text>
  <text x="500" y="330" text-anchor="middle" fill="#fca5a5" font-size="9">Backend Patient.js model stores ONLY: name, age, disease, bed, status</text>
  <text x="500" y="345" text-anchor="middle" fill="#ef4444" font-size="9">→ gender, department, contactNumber, doctor are silently dropped by Mongoose</text>

  <!-- Fix suggestion -->
  <rect x="30" y="360" width="940" height="60" rx="8" fill="rgba(16,185,129,0.05)" stroke="#065f46" stroke-width="1"/>
  <text x="500" y="383" text-anchor="middle" fill="#34d399" font-size="10" font-weight="700">💡 To Fix: Add to Patient.js schema:</text>
  <text x="500" y="400" text-anchor="middle" fill="#6ee7b7" font-size="9">gender: {type:String, enum:['Male','Female','Other']}, department: {type:String}, doctor: {type:String}, contactNumber: {type:String}</text>
</svg>
</div>

<!-- DELETE PANEL -->
<div id="panel-delete" class="panel canvas">
<svg viewBox="0 0 900 400" width="100%" style="min-width:700px">
  <defs>
    <marker id="ar3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/></marker>

  <text x="450" y="30" text-anchor="middle" fill="#f87171" font-size="14" font-weight="800">DELETE /patients/:id — Discharge Flow</text>

  <line x1="590" y1="86" x2="620" y2="86" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#ag3)"/>

  <g class="clickable" onclick="showInfo('d4')">
    <rect x="620" y="60" width="240" height="52" rx="8" fill="#2e1065" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="740" y="82" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">Patient.findByIdAndDelete(id)</text>
    <text x="740" y="96" text-anchor="middle" fill="#c4b5fd" font-size="9">MongoDB delete by _id</text>
    <text x="740" y="108" text-anchor="middle" fill="#a78bfa" font-size="9">404 if not found</text>
  </g>

  <!-- Key behavior note -->
  <rect x="30" y="140" width="830" height="60" rx="8" fill="rgba(245,158,11,0.08)" stroke="#92400e" stroke-width="1.5"/>
  <text x="445" y="163" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="700">⚠️ Important: Local state ALWAYS updated regardless of server response</text>
  <text x="445" y="180" text-anchor="middle" fill="#d97706" font-size="9">setPatients(prev => prev.filter(p => p._id !== id))  ← called after try/catch, not inside success check</text>
  <text x="445" y="195" text-anchor="middle" fill="#d97706" font-size="9">Even if DELETE 404 or network fails, patient vanishes from UI (but stays in DB)</text>

  <text x="445" y="260" text-anchor="middle" fill="#6ee7b7" font-size="9">NotificationContext.push("patient", "Patient Discharged", "{name} has been discharged.")</text>

  <rect x="370" y="55" width="300" height="390" rx="10" fill="rgba(59,130,246,0.06)" stroke="#1e3a8a" stroke-width="1.5"/>

<div class="info-panel" id="infoPanel">
  <button class="cb" onclick="closeInfo()">✕</button>
  <div class="ip-title" id="iTitle"></div>
  <div class="ip-body" id="iBody"></div>
</div>

<script>
const INFO = {
  f1:{title:"useEffect([])",body:`<p>React hook that runs once on component mount. Calls <code>fetchPatients()</code>. The empty dependency array <code>[]</code> means it only runs once — not on re-renders.</p><div class="ok">Source: PatientManagementPage.jsx L64</div>`},
  f2:{title:"fetchPatients()",body:`<p>Async function. Sets loading=true. Has a 500ms artificial delay (<code>await new Promise(r=>setTimeout(r,500))</code>). Then calls GET /patients. Has three outcome paths: real data, empty array, and network error.</p><div class="note">The 500ms delay is for UX only — not required</div>`},
  f3:{title:"GET /patients",body:`<p>No authentication header sent. Public endpoint. Returns JSON array. If <code>res.ok && data.length > 0</code> → use real data. Otherwise fallback.</p><div class="warn">⚠ Unauthenticated — anyone can list all patients</div>`},
  f4:{title:"Patient.find()",body:`<p>Mongoose query: <code>Patient.find().sort({createdAt:-1})</code>. Returns all documents sorted newest-first. No pagination, filtering, or field projection on the server. All patient fields returned.</p>`},
  f5:{title:"Success Path",body:`<p>If data is a non-empty array: <code>setPatients(data)</code>. UI renders real MongoDB documents. These records have only: name, age, disease, bed, status (no gender/doctor/dept).</p><div class="ok">Real data from DB</div>`},
  f6:{title:"Empty Array Fallback",body:`<p>If <code>data.length === 0</code> or <code>!Array.isArray(data)</code>, the frontend silently falls back to <code>fallbackPatients</code>. This means an empty database shows demo data — misleading!</p><div class="warn">⚠ Empty DB looks like demo</div>`},
  f7:{title:"Network Error Fallback",body:`<p>If fetch throws (backend down, CORS error, timeout), catch block runs: <code>setPatients(fallbackPatients)</code>. UI shows demo data. Console shows warning: "Backend unreachable, using demo data".</p><div class="warn">⚠ Backend failure is silent to user</div>`},
  f8:{title:"Search/Filter",body:`<p>Client-side only. <code>filteredPatients = patients.filter(p => name/disease includes search && status matches filter)</code>. Status filter tabs: All, Admitted, Critical, Recovering. All filtering in browser memory.</p>`},
  f9:{title:"Pagination",body:`<p>6 items per page (<code>itemsPerPage = 6</code>). <code>paginatedPatients = filteredPatients.slice((page-1)*6, page*6)</code>. Prev/next buttons. Resets to page 1 on filter change (⚠ bug: doesn't auto-reset on search change).</p>`},
  f10:{title:"Stats Cards",body:`<p>Computed from patients state array: <code>patients.filter(p=>p.status==='Critical').length</code> etc. Reactive to data changes. Shows: Total, Critical, Admitted, Recovering.</p>`},
  f11:{title:"Patient Cards",body:`<p>Grid layout, 1-3 columns responsive. Each card shows: name initial avatar, age, gender, disease, doctor, bed, department, status badge. Discharge button calls handleDelete. View/Edit buttons only push notifications — no real navigation/edit form exists.</p><div class="warn">⚠ View/Edit buttons are notification-only (no real implementation)</div>`},
  a1:{title:"Add Patient Form",body:`<p>Modal form collects 9 fields. Required: name, age, contactNumber, disease, bed, doctor. Status default: "Admitted". Department default: "General Medicine". Gender default: "Male".</p>`},
  a2:{title:"POST /patients",body:`<p>Frontend sends all 9 form fields. Backend ignores: gender, department, doctor, contactNumber, eta. Only saves: name, age, disease, bed. Status always set to "Admitted" regardless of form value.</p><div class="warn">⚠ 5 fields silently dropped</div>`},
  a3:{title:"Backend Validation",body:`<p>Only validates: name, age, disease, bed all present. Does NOT validate types, ranges, or formats. age is cast with <code>Number(age)</code>. Status is hardcoded "Admitted".</p>`},
  a4:{title:"MongoDB Save",body:`<p><code>new Patient({name,age,disease,bed,status:'Admitted'}).save()</code>. Returns the saved document with _id, createdAt, updatedAt. Only 5 fields actually persisted.</p>`},
  a5:{title:"Success Response",body:`<p>On 201: push notification, then call fetchPatients() to reload the list from DB. This ensures UI reflects actual DB state.</p><div class="ok">Correctly reloads from server</div>`},
  a6:{title:"Error Fallback",body:`<p>If POST fails: local state fallback. Creates patient object with <code>_id: 'patient-'+Date.now()</code> and all 9 form fields. This local-only patient looks real but is NOT in the database.</p><div class="warn">⚠ Local patient lost on page refresh</div>`},
  d1:{title:"Discharge Button",body:`<p>Labeled "Discharge" in UI but calls <code>handleDelete(p._id, p.name)</code>. This performs a hard delete, not a status change to "Discharged". Patient is permanently removed from DB.</p><div class="warn">⚠ Discharge = Permanent Delete (not status change)</div>`},
  d2:{title:"Confirm Dialog",body:`<p>Native browser <code>window.confirm()</code> dialog. User must click OK. Cancel returns early. No custom styled dialog.</p>`},
  d3:{title:"DELETE /patients/:id",body:`<p>No auth header. Calls server DELETE route. Note: no error handling on the server response — catch block just logs warning and continues.</p><div class="warn">⚠ No auth check</div>`},
  d4:{title:"findByIdAndDelete",body:`<p>MongoDB delete by _id. Returns the deleted document or null. If null → 404. Otherwise → 200 {message: "Patient deleted successfully"}.</p><div class="ok">Properly returns 404 for invalid ID</div>`}
};
function showInfo(id){const d=INFO[id];if(!d)return;document.getElementById('iTitle').textContent=d.title;document.getElementById('iBody').innerHTML=d.body;document.getElementById('infoPanel').classList.add('open');}
function closeInfo(){document.getElementById('infoPanel').classList.remove('open');}
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('panel-'+name).classList.add('active');
  closeInfo();
}
</script>
</body>
</html>
